plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.protocol.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.protocol.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.activity:activity-compose:1.8.2"

    implementation platform("androidx.compose:compose-bom:2023.10.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"

    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // Async image loading for the user-chosen background. URI -> ImageBitmap
    // with disk cache + downsampling out of the box. ~150 KB on the APK.
    implementation "io.coil-kt:coil-compose:2.5.0"

    // Watch remote for the Live Data tap loop (optional feature — the app is
    // complete without a watch). Only used by the message listener in the
    // Activity; nothing on the logging or flash path touches it. Pinned below
    // the releases that require compileSdk 35+.
    implementation "com.google.android.gms:play-services-wearable:18.2.0"
}
