android.useAndroidX=true

# Gradle's default heap cannot complete a FULL dex merge for this project and
# dies with "D8: java.lang.OutOfMemoryError: Java heap space". Incremental
# builds survive on the default because they only merge what changed, so the
# failure only ever shows up after a clean — which is exactly when you least
# want it, because clean has already deleted the previous APK.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
